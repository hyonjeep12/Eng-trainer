<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Trainer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: sans-serif; padding: 20px; background:#f2f2f2; }
.card { background:white; padding:20px; border-radius:16px; }
button { width:100%; padding:12px; margin-top:10px; font-size:16px; }
</style>
</head>
<body>

<div class="card">
  <h3>🇰🇷 Korean</h3>
  <p id="korean">로딩중...</p>

  <h3>🇺🇸 English</h3>
  <p id="english">Loading...</p>

  <button onclick="speak()">🔊 발음 듣기</button>
  <button onclick="prevBlock()">⬅ 이전</button>
  <button onclick="nextBlock()">➡ 다음</button>
</div>

<script src="app.js"></script>

</body>
</html>
